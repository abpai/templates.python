[project]
name = "templates.python"
version = "0.4.0"
description = "A boilerplate for Python projects."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "Andy Pai", email = "andy@r2pi.co"},
]

dependencies = [
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "structlog>=25.4.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=7.1.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.10",
  "ty>=0.0.5",
]

ml = [
  "torch>=2.9.1",
  "scikit-learn>=1.8.0",
  "mlflow>=3.8.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.0",
  "pandas>=2.3.3",
  "seaborn>=0.13.2",
]

[project.scripts]
templates-python = "templates_python.main:main"

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = ["E501", "B008", "C901", "N812", "N803", "N806"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--cov=templates_python", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ty]
# Astral's ty type checker configuration

[tool.ty.environment]
# Point to your project venv; ty auto-detects .venv but this is explicit & robust.
python = ".venv"
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "*.pyc"]
respect-ignore-files = true

[tool.ty.rules]
# Strict type checking rules
possibly-unresolved-reference = "error"
division-by-zero = "error"

[tool.ty.terminal]
output-format = "concise"

[tool.coverage.run]
branch = true
source = ["templates_python"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templates_python"]
