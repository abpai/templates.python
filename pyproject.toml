[project]
name = "templates.python"
version = "0.4.0"
description = "A boilerplate for Python projects."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Andy Pai", email = "andy@r2pi.co"},
]

dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "ty>=0.0.82",
]

notebook = ["ipykernel>=7.2.0"]

[project.optional-dependencies]
ml = [
  "torch>=2.9.1",
  "scikit-learn>=1.8.0",
  "mlflow>=3.8.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.1",
  "pandas>=2.3.3",
  "seaborn>=0.13.2",
]

[project.scripts]
templates-python = "templates_python.main:main"

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # function annotations
    "C901", # cyclomatic complexity
    "PGH003", # code-specific type ignores
    "PGH004", # code-specific lint ignores
    "RUF", # ruff-specific rules
]
ignore = ["E501", "B008", "N812", "N803", "N806"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib", "--cov=templates_python", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "*.pyc"]
respect-ignore-files = true

[tool.ty.rules]
# Strict type checking rules
possibly-unresolved-reference = "error"
division-by-zero = "error"

[tool.ty.terminal]
output-format = "concise"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["templates_python"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templates_python"]

[tool.quality]
cyclomatic = 10
cognitive = 15
paths = ["src", "tests", "tools/quality"]
advisory-paths = []

[tool.anti-slop]
baseline = "tools/quality/anti-slop-baseline.json"

[tool.anti-slop.rules]
no-adhoc-isinstance = "off"
no-any-parameters = "off"
no-any-returns = "off"
no-any-type-aliases = "off"
no-chained-casts = "error"
no-conditional-empty-dict-spread = "off"
no-dynamic-dispatch = "off"
no-known-value-widening = "off"
no-module-mocking = "off"
no-object-parameters = "off"
no-shape-in-symbol-names = "off"
no-string-attribute-access = "off"
no-unsafe-dict-values = "off"
no-widen-then-cast = "error"
require-safety-comment = "error"

[tool.ruff.lint.mccabe]
max-complexity = 10
